# Nginx — Reverse proxy principal del VPS
# Sustituye TU_DOMINIO por tu dominio real (ej. app.miempresa.com)
# antes de correr por primera vez.
#
# SSL: se gestiona con Certbot/Let's Encrypt.
# Ver scripts/init-ssl.sh para el proceso de obtención del certificado.

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    client_max_body_size 20M;

    # ── Redirige HTTP → HTTPS (excepto la validación de Certbot) ─────────────
    server {
        listen 80;
        server_name TU_DOMINIO;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS ─────────────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name TU_DOMINIO;

        ssl_certificate     /etc/letsencrypt/live/TU_DOMINIO/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/TU_DOMINIO/privkey.pem;

        # Protocolos y ciphers modernos (A+ en SSL Labs)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # ── API (.NET) ────────────────────────────────────────────────────────
        location /api/ {
            proxy_pass         http://api:8080;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # ── Frontend React (SPA) ──────────────────────────────────────────────
        location / {
            proxy_pass         http://frontend:80;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
        }
    }
}
