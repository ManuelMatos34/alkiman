server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Compresión para reducir transferencia de datos
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript image/svg+xml;

    # SPA: cualquier ruta que no exista como archivo sirve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets del build de Vite llevan hash en el nombre → caché agresiva
    location ~* \.(js|css|woff2?|ttf|eot|ico|png|jpg|jpeg|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
